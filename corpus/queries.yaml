# Suchanfragen für den Korpus – OpenAlex-Syntax, gesucht in Titel + Abstract.
#   AND / OR / NOT, "Phrasen" in Anführungszeichen, Klammern. Keine Kommas verwenden!
#   OpenAlex normalisiert Wortformen (nanoparticle findet auch nanoparticles).
# Abgeleitet aus der Zotero-Bibliothek (656 Einträge, Stand 2026-11-11) und nachgeschärft anhand der
# Zotero-Paper, die eine erste Version nicht gefunden hat (SANS, PEG-Reviews, Prozess, CAR-T, KI).
# Jede Anfrage vergibt einen Tag; ein Paper kann mehrere Tags haben.
# Ausführen: python tools/corpus/harvest.py --from 2024-11-11

queries:
  lnp_rna:
    description: LNPs mit RNA-/Nukleinsäure-Cargo (Kernbereich)
    query: >-
      ("lipid nanoparticle" OR LNP OR LNPs)
      AND (mRNA OR siRNA OR saRNA OR "self-amplifying RNA" OR circRNA OR "circular RNA"
       OR "nucleic acid" OR "gene editing" OR "genome editing" OR CRISPR OR RNA)

  ionizable_lipids:
    description: Design und Struktur-Wirkung ionisierbarer Lipide
    query: >-
      "ionizable lipid" OR "ionisable lipid" OR "ionizable cationic lipid" OR "ionizable amino lipid"
      OR "amino lipid" OR lipidoid

  peg_immunity:
    description: PEG, PEG-Lipide, Anti-PEG-Antikörper, ABC-Effekt, Hypersensitivität, PEG-Alternativen
    query: >-
      "anti-PEG" OR "accelerated blood clearance" OR "PEG immunogenicity" OR "PEG-lipid" OR "PEG lipid"
      OR ((PEG OR PEGylated OR PEGylation OR "polyethylene glycol" OR "poly(ethylene glycol)")
          AND ("lipid nanoparticle" OR LNP OR nanomedicine OR liposome OR nanoparticle OR vaccine)
          AND (antibody OR immunogenicity OR hypersensitivity OR anaphylaxis OR "complement activation"
               OR CARPA OR alternative OR alternatives OR dilemma))

  lnp_structure:
    description: Struktur und Biophysik von LNPs, Liposomen und Lipidphasen
    query: >-
      ("lipid nanoparticle" OR LNP OR LNPs OR liposome OR lipoplex OR cubosome OR "lipid phase" OR "lipid mesophase")
      AND (SAXS OR SANS OR "small-angle" OR "neutron scattering" OR "X-ray scattering" OR "cryo-EM" OR "cryo-TEM"
       OR "cryogenic electron" OR "molecular dynamics" OR "coarse-grained" OR simulation
       OR "inverse hexagonal" OR "cubic phase" OR bicontinuous OR "membrane curvature" OR "internal structure"
       OR "phase behavior" OR "phase behaviour" OR morphology OR nanoarchitecture OR hydration
       OR "neutron reflectometry" OR "structure-function" OR "structure-activity")

  lnp_ph_ions:
    description: pH, Puffer, Gegenionen, Salze, Reifung (Kernsammlungen)
    query: >-
      ("lipid nanoparticle" OR LNP OR LNPs OR "ionizable lipid")
      AND (pH OR pKa OR buffer OR counterion OR "counter-ion" OR salt OR "ionic strength" OR ion OR ions
       OR protonation OR maturation OR dialysis OR "buffer exchange" OR "molecular exchange")

  lnp_stability_quality:
    description: Stabilität, Lagerung, Lyophilisation, Aggregation, Analytik, Verunreinigungen
    query: >-
      ("lipid nanoparticle" OR LNP OR LNPs OR "mRNA vaccine" OR "mRNA-LNP")
      AND (stability OR storage OR lyophilization OR lyophilisation OR "freeze-drying" OR "freeze-thaw"
       OR aggregation OR "shelf life" OR degradation OR adduct OR impurity OR "lipid oxidation"
       OR "critical quality attribute" OR analytical OR characterization)

  lnp_process:
    description: Herstellung, Mischung, Fällung, Prozessmodellierung, Scale-up
    query: >-
      ("lipid nanoparticle" OR LNP OR LNPs OR liposome)
      AND (manufacturing OR microfluidic OR mixing OR "T-junction" OR precipitation OR nanoprecipitation
       OR "population balance" OR "process parameter" OR "scale-up" OR "continuous manufacturing"
       OR "self-assembly" OR "formation mechanism")

  delivery_mechanism:
    description: Endosomen-Austritt, Aufnahme, Proteinkorona, Biodistribution, Targeting
    query: >-
      ("endosomal escape" OR "protein corona" OR "membrane fusion" OR biodistribution OR extrahepatic
       OR "organ-selective" OR "cellular uptake" OR "targeted delivery" OR "cell-specific")
      AND ("lipid nanoparticle" OR LNP OR LNPs OR "mRNA delivery" OR "siRNA delivery" OR "nucleic acid delivery"
       OR "RNA delivery" OR lipoplex OR polyplex)

  rna_therapeutics:
    description: RNA-Therapeutika allgemein (Reviews, Klinik, Design)
    query: >-
      "mRNA therapeutic" OR "mRNA therapeutics" OR "mRNA therapy" OR "mRNA medicine" OR "RNA therapeutics"
      OR "RNA medicine" OR "mRNA design" OR "mRNA delivery" OR "RNA delivery" OR "nucleic acid delivery"
      OR "nucleic acid therapeutics"

  rna_vaccines_immuno:
    description: RNA-Vakzine, Immuntherapie, angeborene Immunität, Reaktogenität, in-vivo-CAR
    query: >-
      (mRNA OR saRNA OR "self-amplifying RNA" OR circRNA OR "RNA vaccine" OR "RNA neoantigen")
      AND (vaccine OR immunotherapy OR neoantigen OR adjuvant OR reactogenicity OR "innate immune"
       OR "CAR T" OR "CAR-T" OR "chimeric antigen receptor" OR immunogenicity)
      AND ("lipid nanoparticle" OR LNP OR formulation OR delivery OR adjuvant OR "innate immune" OR "T cell"
       OR "CAR T" OR "CAR-T" OR "chimeric antigen receptor" OR neoantigen OR mechanism OR design)
      NOT (hesitancy OR acceptance OR "vaccination coverage" OR survey OR "vaccine effectiveness" OR "real-world")

  cancer_vaccines:
    description: Krebsvakzine und Nanomedizin in der Immunonkologie (auch ohne RNA)
    query: >-
      "cancer vaccine" OR "tumor vaccine" OR "tumour vaccine" OR "neoantigen vaccine"
      OR "personalized cancer vaccine" OR "in situ vaccination"
      OR (("therapeutic vaccine" OR immunotherapy) AND ("lipid nanoparticle" OR LNP OR liposome OR mRNA))

  ml_formulation:
    description: ML, Bayes'sche Optimierung, DoE, Hochdurchsatz für Formulierungen und Materialien
    query: >-
      ("machine learning" OR "deep learning" OR "Bayesian optimization" OR "design of experiments"
       OR "high-throughput screening" OR "active learning" OR "computational design" OR "generative model")
      AND ("lipid nanoparticle" OR LNP OR "ionizable lipid" OR liposome OR "nucleic acid delivery"
       OR "mRNA delivery" OR "gene delivery" OR polyplex OR "nanoparticle formulation" OR "lipid formulation"
       OR "drug formulation" OR "drug delivery system")

  bayesian_optimization:
    description: Methodik Bayes'sche Optimierung (auch allgemein, für eigene Experimente)
    query: >-
      "Bayesian optimization" AND ("high-dimensional" OR "high dimensions" OR "experimental design"
       OR "self-driving" OR materials OR chemistry OR formulation OR "multi-objective")

  ai_discovery:
    description: KI-Systeme für wissenschaftliche Entdeckung, autonome Labore
    query: >-
      "self-driving laboratory" OR "self-driving lab" OR "autonomous laboratory" OR "autonomous experimentation"
      OR "AI scientist" OR "co-scientist"
      OR ("scientific discovery" AND ("large language model" OR "multi-agent" OR "AI system" OR "AI agent"))

  other_carriers:
    description: Andere Träger für Nukleinsäuren (Polymere, Lipoplexe, Cubosomen, EVs, Hybride)
    query: >-
      (polyplex OR "cationic polymer" OR "poly(beta-amino ester)" OR PBAE OR lipoplex OR cubosome
       OR "extracellular vesicle" OR "lipid-polymer hybrid" OR "polymeric nanoparticle" OR dendrimer)
      AND (mRNA OR siRNA OR "nucleic acid delivery" OR "gene delivery" OR transfection OR plasmid)
